<div class="container my-4">
<h1 class="text-info fs-2 fw-light">SHOPPING CART</h1>
<table class="table shadow">
    <thead class=" table-secondary text-center">
      <tr class="py-4">
        <th scope="col">#</th>
        <th scope="col">Product Image</th>
        <th scope="col">Product Name</th>
        <th scope="col"> Price</th>
        <th scope="col">Quantity</th>
        <th scope="col">Deliverry Charges</th>
        <th scope="col">SubTotal</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody class="text-center">

 <tr *ngFor="let item of products; let i=index">
        <th scope="row">{{ i+1 }}</th>
        <td>
          <img [src]="item.image" class="img-fluid" style="max-height: 80px;">
        </td>
        <td>{{ item.name }}</td>
        <td>Rs {{ item.price }}</td>
        <td>{{ item.quantity || 1 }}</td>
        <td>200</td>
        <td>{{ (item.price * (item.quantity || 1)) + 200 }}</td>
        <td>
          <button class="btn btn-outline-info" (click)="checkout()">Checkout</button>
        </td>
      </tr>
    
      <tr>
        <td></td>
        <td><button class="btn btn-info" (click)="continueShopping()" >Continue Shopping<i class="fa-sharp fa-solid fa-arrow-right-from-bracket ms-2 mt-2"></i></button></td>
        <td></td><td></td><td></td><td></td><td></td>
        <td><button class="btn btn-info">Clear Shopping Cart</button></td>
      </tr>
    </tbody>
  </table>
</div>
