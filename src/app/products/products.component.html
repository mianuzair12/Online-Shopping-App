<div class="container-fluid my-3">
  <div class="row gx-3 gy-4 mx-3 p-3 shadow"> <!-- gx = horizontal gap, gy = vertical gap -->
    <div class="col-12 col-sm-6 col-md-3" *ngFor="let item of products; let i = index">
      <div class="card h-100 product-card">
        <!-- image -->
        <div class="img-wrap">
          <img [src]="item.image" class="card-img-top img-fluid product-img" alt="{{ item.name }}">
        </div>

        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-center mb-2 fs-5">{{ item.name }}</h5>

          <p class="card-text text-center mb-2">
            <span class="price">Rs {{ item.price }}</span>
            <span *ngIf="item.discount" class="discount"> — {{ item.discount }}% Off</span>
          </p>

          <p class="card-text text-center text-muted small mb-3" *ngIf="item.description">{{ item.description }}</p>

          <div class="mt-auto text-center">
            <button (click)="Order(item.id)" class="btn btn-outline-primary w-100" >Order Now</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
